name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        playwright install chromium --with-deps
        sudo apt-get install -y poppler-utils
        
    - name: Run tests
      run: |
        PYTHONPATH=. pytest tests/
        
    - name: Check generated files freshness
      run: |
        python scripts/build_config.py
        python scripts/build_html.py
        python scripts/generate_resume_pdf.py
        git diff --exit-code config.js index.html robots.txt sitemap.xml preview.jpg \
          William_Elias_Software_Platform_Resume.pdf William_Elias_Production_DevOps_Resume.pdf \
          William_Elias_Resume.pdf
        # The legacy URL is a compatibility alias of the Production & DevOps résumé.
        cmp William_Elias_Resume.pdf William_Elias_Production_DevOps_Resume.pdf
